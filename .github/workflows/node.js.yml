name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./velocitymotors/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install

      - name: Wipe test database
        run: npm run wipe

      - name: Run server tests
        run: npm test

  client:
    runs-on: ubuntu-latest
    needs: server

    defaults:
      run:
        working-directory: ./velocitymotors/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        run: npm install --legacy-peer-deps

      - name: Build client
        run: npm run build
